name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: [ "1.25.x" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Verify modules
      run: go mod verify

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    # Skip golden tests in CI — they depend on a /tmp fixture vault that
    # isn't checked in. Unit tests cover the same code paths with
    # self-contained fixtures.
    - name: Test
      run: go test -race -count=1 ./internal/...
